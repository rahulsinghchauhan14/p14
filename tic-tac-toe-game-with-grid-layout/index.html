<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="./stytle.css">
</head>
<body>
    <div class="container">
        <div class="title">
            Tic-Tac-Toe
        </div>

        <div class="tic-tac-layout">
            <div class="box red">X</div>
            <div class="box blue">O</div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box red">X</div>
            <div class="box"></div>
            <div class="box blue">O</div>
            <div class="box"></div>
            <div class="box red">X</div>
        </div>
    </div>
</body>
</html>
